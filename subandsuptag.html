<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subscript and Superscript Tag </title>
</head>
<body>
    <h1>
        Lets write some formulas of maths in superscript tag
    </h1>
    <ol>
        <li>
            a<sup>2</sup>+b<sup>2</sup>+2ab
        </li>
        <li>
            a<sup>2</sup>+b<sup>2</sup>-2ab
        </li>
        <li>
            a<sup>2</sup>+b<sup>2</sup>+c<sup>2</sup>+2ab+2bc+2ca
        </li>
    </ol>

    <h1>
        Lets write some formulas of chemistry in subscript Tag
    </h1>
    <ol>
        <li>
            H<sub>2</sub>O
        </li>
        <li>
            CO<sub>2</sub>
        </li>
        <li>
           H<sub>2</sub>SO<sub>4
           </sub>
        </li>
    </ol>
</body>
</html>
