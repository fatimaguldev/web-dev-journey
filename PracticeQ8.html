<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Button Form</title>
</head>
<body>
    <h2>
        Search Query Attribute
    </h2>
    
    <form action="https://www.google.com/search">

        <input type="Search on Google" name="q" placeholder="search on google" id="google">

        <button>Search</button>
    </form>
</body>
</html>
