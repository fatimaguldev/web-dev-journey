<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback Form</title>
</head>
<body>
    <form action="/action">
        <h3>Feedback Form</h3>
         <label for="name">Name: </label>
        <input type="text" name="name" id="name" placeholder="write your name">
        <br>
        <br>
         <label for="email">Email </label>
        <input type="email" name="email" id="email" placeholder="write your email">
        <br>
        <br>
         Message: 
         <br>
        <textarea name="message" id="message" rows="8" cols="20" placeholder="Enter Your feedback here"></textarea>
        <br>
        Rate Us out of 5 &star;:
        <br>
        <input type="radio" name="rating" id="One" value="one">
        <label for="one">1</label>
        <br>
         <input type="radio" name="rating" id="2">
        <label for="two">2</label>
        <br>
         <input type="radio" name="rating" id="3">
        <label for="three">3</label>
        <br>
         <input type="radio" name="rating" id="4">
        <label for="four">4</label>
        <br>
         <input type="radio" name="rating" id="5">
        <label for="five">5</label>
       <br>
       <br>
       <button>Send Us Your Message!</button>
    </form>
</body>
</html>
