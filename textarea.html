<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Area</title>
</head>
<body>
    <form action="action">
        <label for="feedback">share your valuable feedback here: </label>
       <textarea name="feedback" id="feedback" rows="5" col="5"
       placeholder="write your feedback here">
       </textarea>
       <br>
       <button>submit</button>
       <button>reset
       </button>
    </form>
</body>
</html>
