<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List</title>
</head>
<body>
    <h1>
        Lists and its types
    </h1>
    <h2>
        Unordered Lists
    </h2>
    <ul>
        <li>Bread</li>
         <li>Rice</li> 
          <li>Sugar</li>
           <li>Sauces</li>
    </ul>
    <h2>
        Ordered List
    </h2>

    <ol type="a">
         <li>Khuzaim</li>
          <li>Ayan</li>
           <li>Arham</li>
            <li>Rayan</li>
             <li>Rahim</li>
    </ol>
    <ol type="i">
         <li>Khuzaim</li>
          <li>Ayan</li>
           <li>Arham</li>
            <li>Rayan</li>
             <li>Rahim</li>
    </ol>
    <ol type="I">
         <li>Khuzaim</li>
          <li>Ayan</li>
           <li>Arham</li>
            <li>Rayan</li>
             <li>Rahim</li>
    </ol>
</body>
</html>
