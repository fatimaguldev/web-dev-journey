<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment</title>
</head>
<body>
    <Form>
        <label for="name">Name: </label>
        <input type="text" placeholder="Name" id="Name" value="name" name="name">
        <br>
        <br>
        <label for="sex">Sex:</label>

        <input type="radio" name="sex" id="Male" value="M">
        <label for="sex">Male</label>
        <input type="radio" name="sex" id="Female" Value="F">
        <label for="sex">Female</label>
        <input type="radio" name="sex" id="Others" value="O">
        <label for="sex">Others</label>
        <br>
        <br>
        <br>
        <div>
            Select Your Country:
            <select name="country" id="country">
                <option>Choose Your Country</option>
                <option value="Pak" >Pakistan</option>
                <option value="Afgh">Afghanistan</option>
                <option value="UAE">United Arab Emrites</option>
                <option value="AUS">Australia</option>
            </select>
        </div>
        <br>
        <br>
       <div>
        <label for="message">Message </label>
        <br>
        <textarea name="message" id="message"></textarea>
       </div>
       <br>
       <div>
       <input type="checkbox" id="sub"name="sub">
       <label for="sub">Subscribe? </label>
        </div>
        <br>
        <Button>Submit </Button>
       
    </Form>
    <hr>
    <form action="/action">
        <h3>Feedback Form</h3>
         <label for="name">Name: </label>
        <input type="text" name="name" id="name" placeholder="write your name">
        <br>
        <br>
         <label for="email">Email </label>
        <input type="email" name="email" id="email" placeholder="write your email">
        <br>
        <br>
         Message: 
         <br>
        <textarea name="message" id="message" rows="8" cols="20" placeholder="Enter Your feedback here"></textarea>
        <br>
        Rate Us out of 5 &star;:
        <br>
        <input type="radio" name="rating" id="One" value="one">
        <label for="one">1</label>
        <br>
         <input type="radio" name="rating" id="2">
        <label for="two">2</label>
        <br>
         <input type="radio" name="rating" id="3">
        <label for="three">3</label>
        <br>
         <input type="radio" name="rating" id="4">
        <label for="four">4</label>
        <br>
         <input type="radio" name="rating" id="5">
        <label for="five">5</label>
       <br>
       <br>
       <button>Send Us Your Message!</button>
    </form>
    <hr>
    <table border="black">
        <caption>Student Information</caption>
        
            <tr>
                <th rowspan="6">Info</th>
                <th rowspan="2">Name</th>
                <th colspan="2">Address</th>
            </tr>
            <tr>
                <th>City</th>
                <th>House</th>
            </tr>

            </tr>
            <tr>

            </tr>
            <tr>

            </tr>
            <tr>
                <td>D</td>

            </tr>
        
    </table>
</body>
</html>
