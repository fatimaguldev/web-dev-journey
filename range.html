<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Range</title>
</head>
<body>
    <form action="server">
        <div>
            <label for="vol">Select your volume Level</label>
            <input type="range" id="vol" name="volume" min="0" max="100" name="vol" step="10" value="30">
            <!-- here in above line step is for volume increase in 10x and value is when we open it the vlume will be by default 30 -->
            <button>submit</button>
        </div>
    </form>
</body>
</html>
