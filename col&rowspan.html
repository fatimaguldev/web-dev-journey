<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Col and Row Span</title>
</head>
<body>
    <table border="black">
        <caption>Project Payments</caption>
        <!-- table header -->
<thead>
        <tr>
            <th rowspan="2">Projects</th>
        <th colspan="2">Prices</th>
    </tr>
    <tr>
        <th>PKR</th>
         <th>USD</th>
    </tr>
</thead>
<!-- table body -->
<tbody>
     <tr><td>Katchap</td>
        <td>1M</td>
        <td>3000</td>
    </tr>

         <tr><td>Ocean capital exchange</td>
        <td>150k</td>
        <td>600</td>
    </tr>

         <tr><td>Noor Perfumes</td>
        <td>100k</td>
        <td>450</td>
    </tr>

         <tr><td>Mediazas</td>
        <td>70k</td>
    <td>250</td>
</tr>
</tbody>
    </table>
</body>
</html>
